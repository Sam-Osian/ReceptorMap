<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access Denied — ReceptorMap Editor</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FBFAF7'/%3E%3Cpath d='M16 6 C 10 6%2C 7 10%2C 7 16 C 7 22%2C 10 26%2C 16 26 L 16 20 C 13 20%2C 12 18.2%2C 12 16 C 12 13.8%2C 13 12%2C 16 12 Z' fill='%23111216'/%3E%3Ccircle cx='19' cy='16' r='3.2' fill='%236B4CFF'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: "Inter", ui-sans-serif, sans-serif;
            background: #FBFAF7;
            color: #3B3D44;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            background: #FFFFFF;
            border: 1px solid #E9E6DF;
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(17,18,22,0.05), 0 8px 24px rgba(17,18,22,0.07);
            padding: 32px 28px;
            max-width: 360px;
            width: 100%;
            text-align: center;
        }
        .card i {
            font-size: 28px;
            color: #A09EA6;
            display: block;
            margin-bottom: 14px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #111216;
        }
        p {
            margin: 0 0 20px;
            font-size: 13px;
            color: #6C6A72;
            line-height: 1.6;
        }
        a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #3E26CC;
            text-decoration: none;
            border-bottom: 1px solid #CBBFFF;
            padding-bottom: 1px;
        }
        a:hover { color: #6B4CFF; border-bottom-color: #6B4CFF; }
    </style>
</head>
<body>
    <div class="card">
        <i class="hgi-stroke hgi-lock-01"></i>
        <h1>Access denied</h1>
        <p>Your account does not have the <strong>can_edit_csv</strong> permission. Ask an administrator to add you to the <strong>Dataset Editors</strong> group in Django admin.</p>
        <a href="{% url 'home' %}">← Back to ReceptorMap</a>
    </div>
</body>
</html>
